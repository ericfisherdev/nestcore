# Lefthook Git hooks.
#
# Commands delegate to Makefile targets / pinned go tools so local hooks and CI
# enforce the same gates. Enable them with `make hooks` (which runs
# `go tool lefthook install`). Tooling is pinned in go.mod (lefthook, conform)
# and the README (golangci-lint).

# commit-msg validates the message against Conventional Commits (.conform.yaml)
# so a non-conforming message is rejected before the commit is created. {1} is
# the path to the commit message file that git passes to the hook.
commit-msg:
  jobs:
    - name: conventional-commit
      run: go tool conform enforce --commit-msg-file {1}
    # conform cannot require the Jira key: it treats an empty scope as valid,
    # so "feat: no key" passes the job above. This is the gate that rejects it
    # (NES-170). CI runs the same script over the PR's commits.
    - name: commit-scope
      run: scripts/check-commit-scope.sh --file {1}

# pre-commit runs the fast gates on staged changes, piped so it stops at the
# first failure. Committing unformatted, lint-failing, or test-failing code is
# blocked.
pre-commit:
  piped: true
  jobs:
    - name: fmt
      glob: "*.{go,templ}"
      run: make fmt
      # Re-stage files that were already staged and got reformatted.
      stage_fixed: true
    - name: templ-generate
      glob: "*.templ"
      # Two checks, not one: `git diff --exit-code` (working tree vs the
      # INDEX) fails if generating produced content different from what's
      # staged — the right comparison in a pre-commit hook, since the normal
      # "index differs from HEAD" of every staged change must NOT trip this.
      # But a brand-new .templ file whose generated companion was never
      # `git add`ed has no index entry at all, so `git diff` sees nothing for
      # it — `git ls-files --others` is what actually catches that case.
      # Note: '*_templ.go' is a git pathspec, not a shell glob — '*' crosses
      # directory boundaries, so it matches generated files at any depth (e.g.
      # ui/components/layout_templ.go).
      run: make generate && git diff --exit-code -- '*_templ.go' && test -z "$(git ls-files --others --exclude-standard -- '*_templ.go')"
    - name: lint
      glob: "*.go"
      run: make lint
    - name: test
      glob: "*.go"
      # Fast feedback on commit; the full race suite runs on pre-push and in CI.
      run: go test ./...

# pre-push is the heavier safety net: the full race-enabled suite and lint over
# the whole module before anything leaves the machine.
pre-push:
  parallel: true
  jobs:
    - name: lint
      run: make lint
    - name: test
      run: make test
